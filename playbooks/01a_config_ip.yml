---
- name: Cấu hình IP Tĩnh và Hostname tự động cho hàng loạt iDRAC qua File Mapping CSV
  hosts: dell_servers
  connection: local
  gather_facts: false

  vars:
    mapping_file: "{{ playbook_dir }}/../ip_mapping.csv"

  tasks:
    - name: 1. Thu thập thông tin Service Tag phần cứng của Server
      dellemc.openmanage.idrac_system_info:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: false
      register: idrac_info

    - name: 2. Ghi nhận và làm sạch chuỗi Service Tag
      set_fact:
        server_tag: "{{ idrac_info.system_info.System[0].ServiceTag | trim | upper }}"

    - name: DEBUG - In Service Tag đọc từ iDRAC
      debug:
        msg: "ServiceTag từ iDRAC = [{{ server_tag }}]"

    - name: 3. Đọc dữ liệu file ip_mapping.csv
      community.general.read_csv:
        path: "{{ mapping_file }}"
        key: Serial
      register: csv_master
      delegate_to: localhost

    - name: DEBUG - In tất cả Serial trong CSV
      debug:
        msg: "{{ csv_master.dict.keys() | list }}"

    - name: DEBUG - Kiểm tra tag có tồn tại trong CSV không
      debug:
        msg: "Tag {{ server_tag }} tồn tại trong CSV: {{ server_tag in csv_master.dict }}"

    - name: DEBUG - Hiển thị record tương ứng nếu tìm thấy
      debug:
        var: csv_master.dict[server_tag]
      when: server_tag in csv_master.dict

    - name: DEBUG - Báo lỗi nếu không tìm thấy tag
      debug:
        msg: "KHÔNG tìm thấy Service Tag {{ server_tag }} trong file CSV"
      when: server_tag not in csv_master.dict

    - name: 4. Thiết lập Network Attributes và Hostname chuẩn quy hoạch cho iDRAC
      dellemc.openmanage.idrac_attributes:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: false

        idrac_attributes:
          NIC.1.DNSRacName: "{{ csv_master.dict[server_tag].hostname }}"
          IPv4.1.Enable: "Enabled"
          IPv4.1.DHCPEnable: "Disabled"
          IPv4Static.1.Address: "{{ csv_master.dict[server_tag].OOB_IP }}"
          IPv4Static.1.Netmask: "255.255.255.0"
          IPv4Static.1.Gateway: "10.169.14.1"

      when: server_tag in csv_master.dict
      register: config_result
      ignore_errors: true

    - name: DEBUG - Kết quả cấu hình
      debug:
        var: config_result
      when: server_tag in csv_master.dict

    - name: 5. Hiển thị thông báo trạng thái đổi IP
      debug:
        msg: >-
          Server [{{ server_tag }}]
          -> Hostname={{ csv_master.dict[server_tag].hostname }}
          -> OOB_IP={{ csv_master.dict[server_tag].OOB_IP }}
      when: server_tag in csv_master.dict
